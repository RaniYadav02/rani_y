<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Invasystems</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            margin: auto;
            border-radius: 10px;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 18px;
        }
        button {
            padding: 12px 25px;
            background: #0078ff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello Invasystems 👋</h1>
        <p>Welcome to your single‑page HTML site!</p>
        <button onclick="alert('Hello Rani! Your webpage is working 🎉')">Click Me</button>
    </div>

</body>
</html>
